services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mylife
      POSTGRES_PASSWORD: mylife
      POSTGRES_DB: mylife
    ports:
      # Host 5433: local 5432 is often taken by other stacks on this machine.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
